services:
  postgres:
    image: postgres:15-alpine
    container_name: wokedex-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wokedex}
      POSTGRES_USER: ${POSTGRES_USER:-wokedex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wokedex}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - wokedex-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-wokedex} -d ${POSTGRES_DB:-wokedex}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-umami:
    image: postgres:15-alpine
    container_name: wokedex-postgres-umami
    environment:
      POSTGRES_DB: ${UMAMI_DB:-umami}
      POSTGRES_USER: ${UMAMI_DB_USER:-umami}
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:-umami}
    volumes:
      - postgres_umami_data:/var/lib/postgresql/data
    networks:
      - wokedex-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${UMAMI_DB_USER:-umami} -d ${UMAMI_DB:-umami}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.7.0
    container_name: wokedex-meilisearch
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:-your-master-key}
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - wokedex-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: wokedex-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - wokedex-network
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: wokedex-umami
    environment:
      DATABASE_URL: postgresql://${UMAMI_DB_USER:-umami}:${UMAMI_DB_PASSWORD:-umami}@postgres-umami:5432/${UMAMI_DB:-umami}
      DATABASE_TYPE: postgresql
      HASH_SALT: ${UMAMI_HASH_SALT:-your-hash-salt}
    ports:
      - "3002:3000"
    networks:
      - wokedex-network
    depends_on:
      - postgres-umami
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  hono-app:
    build: .
    container_name: hono_app
    env_file:
      - .env
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - ./localhost.key:/app/localhost.key:ro
      - ./localhost.crt:/app/localhost.crt:ro

volumes:
  postgres_data:
    driver: local
  postgres_umami_data:
    driver: local
  meilisearch_data:
    driver: local
  minio_data:
    driver: local

networks:
  wokedex-network:
    driver: bridge
